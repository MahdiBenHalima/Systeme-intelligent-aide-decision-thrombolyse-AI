name: Validate Thrombolysis AI research software

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install unit-test dependencies
        run: python -m pip install "numpy>=1.26" "pandas>=2.0" "scikit-learn>=1.3" "pytest>=8" "xgboost>=2.0"
      - name: Validate original inference contract and synthetic demo
        run: python -m pytest tests -q
      - name: Run reproducible non-clinical training demo
        run: python -m experimental_ml.demo_pipeline --samples 240 --seed 42
