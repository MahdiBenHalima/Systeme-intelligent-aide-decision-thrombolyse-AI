name: Validate Thrombolysis AI contract

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install contract test dependencies
        run: python -m pip install "pandas>=2.0" "pytest>=8"
      - name: Validate real inference schema and data privacy boundary
        run: python -m pytest tests -q
